services:
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    container_name: fashion-mlflow
    command: >-
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root file:///mlflow/artifacts
      --artifacts-destination file:///mlflow/artifacts
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  minio:
    image: elestio/minio:latest
    container_name: fashion-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9003:9000"
      - "9004:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  webhook:
    build:
      context: .
    container_name: fashion-webhook
    command: uvicorn fashion_mnist.webhook_receiver:app --host 0.0.0.0 --port 8001
    ports:
      - "8003:8001"
    restart: unless-stopped

  api:
    build:
      context: .
    container_name: fashion-api
    command: uvicorn fashion_mnist.api:app --host 0.0.0.0 --port 8000
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: fashion-minst-bucket
      MODEL_OBJECT_KEY: ""
      WEBHOOK_URL: http://webhook:8001/webhook
      ARTIFACTS_DIR: /artifacts
    volumes:
      - model_artifacts:/artifacts
    ports:
      - "8004:8000"
    depends_on:
      - mlflow
      - minio
      - webhook
    restart: unless-stopped

  streamlit:
    build:
      context: .
    container_name: fashion-ui
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports:
      - "8503:8501"
    depends_on:
      - api
    restart: unless-stopped

  train:
    build:
      context: .
    container_name: fashion-train
    command: python -m fashion_mnist.train --config configs/train.toml
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: fashion-minst-bucket
      WEBHOOK_URL: http://webhook:8001/webhook
      ARTIFACTS_DIR: /artifacts
    volumes:
      - ./:/app
      - ./configs:/app/configs:ro
      - ./outputs:/app/outputs
      - model_artifacts:/artifacts
    depends_on:
      - mlflow
      - minio
      - webhook
    restart: "no"

volumes:
  mlflow_data:
  minio_data:
  model_artifacts:
